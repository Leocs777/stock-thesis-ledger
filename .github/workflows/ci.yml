name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile app.py test_app.py scripts/check-local-links.py
      - name: Test
        run: python -m unittest -v

  package:
    name: Packaging checks
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check local Markdown links
        run: python3 scripts/check-local-links.py
      - name: Check shell syntax
        run: zsh -n setup.sh scripts/archive-testflight.sh scripts/reload-local-service.sh
      - name: Check plist syntax
        run: plutil -lint ios/InvestorLab/Info.plist ios/ExportOptions.plist scripts/org.investorlab.server.plist scripts/org.investorlab.tunnel.plist
